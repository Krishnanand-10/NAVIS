# NAVIS Simulation and Sensor Configuration Profiles

sensor_grades:
  consumer:
    name: "Consumer Grade (e.g. MPU6050 / Smartphone)"
    acc_noise_density: 0.003       # m/s^2 / sqrt(Hz)
    acc_random_walk: 0.0005        # m/s^3 / sqrt(Hz)
    acc_turn_on_bias_std: 0.1      # m/s^2
    acc_scale_misalignment_std: 0.005
    gyro_noise_density: 0.001      # rad/s / sqrt(Hz)
    gyro_random_walk: 0.0001       # rad/s^2 / sqrt(Hz)
    gyro_turn_on_bias_std: 0.02    # rad/s
    gyro_scale_misalignment_std: 0.005

  industrial:
    name: "Industrial Grade (e.g. ADIS16488 / Xsens MTi)"
    acc_noise_density: 0.0008
    acc_random_walk: 0.00008
    acc_turn_on_bias_std: 0.015
    acc_scale_misalignment_std: 0.001
    gyro_noise_density: 0.00015
    gyro_random_walk: 0.000015
    gyro_turn_on_bias_std: 0.002
    gyro_scale_misalignment_std: 0.001

  tactical_space:
    name: "Tactical & Space Grade (e.g. ISRO FOG / RLG)"
    acc_noise_density: 0.0002
    acc_random_walk: 0.00001
    acc_turn_on_bias_std: 0.002
    acc_scale_misalignment_std: 0.0002
    gyro_noise_density: 0.00003
    gyro_random_walk: 0.000002
    gyro_turn_on_bias_std: 0.0003
    gyro_scale_misalignment_std: 0.0002

presets:
  urban_tunnel_outage:
    profile: "urban_driving"
    duration: 120.0
    dt: 0.01
    imu_grade: "industrial"
    gps_rate: 1.0
    gps_outages:
      - [30.0, 70.0]  # 40-second complete GPS denied tunnel

  pedestrian_dead_reckoning:
    profile: "pedestrian"
    duration: 90.0
    dt: 0.01
    imu_grade: "consumer"
    gps_rate: 1.0
    gps_outages:
      - [15.0, 85.0]  # Indoor GPS outage

  lunar_rover_traverse:
    profile: "planetary_rover"
    duration: 180.0
    dt: 0.02
    imu_grade: "tactical_space"
    gps_rate: 0.0     # No GPS on Lunar surface
    lunar_gravity: true
